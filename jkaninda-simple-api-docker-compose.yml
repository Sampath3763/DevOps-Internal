services:
  simple-api:
    image: jkaninda/simple-api:latest
    container_name: simple-api
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - RUN_DATA_SEED=true
    depends_on:
      - redis
  redis:
    image: redis:latest
    container_name: redis

